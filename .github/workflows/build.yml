name: Build & Verify

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 手动触发

jobs:
  # ── Job 1: 纯 Kotlin/JVM 框架构建（无需 Android SDK）──
  build-core:
    name: Build Core Framework
    runs-on: ubuntu-latest
    env:
      CI_CORE_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build & Test Core Framework
        run: |
          ./gradlew --no-daemon \
            :agent-api:check \
            :rikka-bridge:check \
            --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/
          retention-days: 7
          if-no-files-found: ignore

  # ── Job 2: 完整 Android 构建（需要 Android SDK）──
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    needs: build-core  # 先等 core 构建通过
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew --no-daemon :ide-android:assembleDebug --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            **/build/outputs/apk/**/*.apk
          retention-days: 7

  # ── Job 3: 验证 rikka-bridge 模块 ──
  verify-rikka-bridge:
    name: Verify Rikka Bridge Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify rikka-bridge compiles
        run: |
          ./gradlew --no-daemon :rikka-bridge:compileKotlin --stacktrace

      - name: Check rikka-bridge structure
        run: |
          echo "=== rikka-bridge 文件结构 ==="
          find rikka-bridge -type f | sort
          echo ""
          echo "=== 模块统计 ==="
          echo "源文件数: $(find rikka-bridge/src -name '*.kt' | wc -l)"
          echo "总行数: $(find rikka-bridge/src -name '*.kt' -exec cat {} + | wc -l)"
